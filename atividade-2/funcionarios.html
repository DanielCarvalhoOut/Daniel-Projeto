<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeCraft Labs - Funcionários</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary bg-dark" data-bs-theme="dark">
        <div class="container-fluid">
            <a href="./index.html" class="navbar-brand">
                <span class="material-symbols-outlined text-warning align-middle">rocket_launch</span>
                CodeCraft Labs
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a href="./index.html" class="nav-link">Home</a>
                    </li>
                    <li class="nav-item">
                        <a href="./funcionarios.html" class="nav-link active">Funcionários</a>
                    </li>
                    <li class="nav-item">
                        <a href="#relatorios" class="nav-link">Relatórios</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">

        <h3 id="tituloFormulario">Cadastro de Funcionários</h3>

        <form id="formFuncionario" method="post">
            <label for="nome">Nome:</label><br>
            <input type="text" id="nome" name="nome" placeholder="Digite o nome" required><br><br>

            <label for="idade">Idade:</label><br>
            <input type="number" id="idade" name="idade" min="14" placeholder="Digite a idade" required><br><br>

            <label for="cargo">Cargo:</label><br>
            <input type="text" id="cargo" name="cargo" placeholder="Ex: Desenvolvedor" required><br><br>

            <label for="salario">Salário (R$):</label><br>
            <input type="number" id="salario" name="salario" min="0" step="0.01" placeholder="Ex: 5500"
                required><br><br>

            <input type="submit" id="btnCadastrar" value="Cadastrar">
            <input type="button" id="btnCancelar" value="Cancelar edição" hidden>
        </form>

        <hr>

        <h3>Funcionários Cadastrados</h3>

        <label for="busca">Buscar por nome:</label>
        <input type="text" id="busca" placeholder="Digite parte do nome">
        <input type="button" id="btnBuscar" value="Buscar">
        <input type="button" id="btnLimparBusca" value="Mostrar todos">
        <br><br>

        <table border="1" cellpadding="3" cellspacing="0">
            <thead>
                <tr>
                    <th bgcolor="grey" width="50">ID</th>
                    <th bgcolor="grey" width="180">Nome</th>
                    <th bgcolor="grey" width="70">Idade</th>
                    <th bgcolor="grey" width="160">Cargo</th>
                    <th bgcolor="grey" width="130">Salário</th>
                    <th bgcolor="grey" width="150">Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaFuncionarios"></tbody>
        </table>

        <hr>

        <h3 id="relatorios">Relatórios</h3>
        <input type="button" id="btnSalarioMaior5000" value="Salário maior que R$ 5000">
        <input type="button" id="btnMediaSalarial" value="Média salarial">
        <input type="button" id="btnCargosUnicos" value="Cargos únicos">
        <input type="button" id="btnNomesMaiusculo" value="Nomes em maiúsculo">

        <div id="resultadoRelatorio" class="mt-3 mb-5"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/funcionario.js"></script>
    <script src="./js/funcionarioController.js"></script>
</body>

</html>
