<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeCraft Academy - Alunos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary bg-dark" data-bs-theme="dark">
        <div class="container-fluid">
            <a href="./index.html" class="navbar-brand">
                <span class="material-symbols-outlined text-warning align-middle">terminal</span>
                CodeCraft Academy
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a href="./index.html" class="nav-link">Home</a>
                    </li>
                    <li class="nav-item">
                        <a href="./alunos.html" class="nav-link active">Alunos</a>
                    </li>
                    <li class="nav-item">
                        <a href="#relatorios" class="nav-link">Relatórios</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">

        <h3 id="tituloFormulario">Cadastro de Alunos</h3>

        <form id="formAluno" method="post">
            <label for="nome">Nome:</label><br>
            <input type="text" id="nome" name="nome" placeholder="Digite o nome do aluno" required><br><br>

            <label for="idade">Idade:</label><br>
            <input type="number" id="idade" name="idade" min="1" placeholder="Digite a idade" required><br><br>

            <label for="curso">Curso:</label><br>
            <select id="curso" name="curso" required>
                <option value="">-- Selecione --</option>
                <option value="JavaScript">JavaScript</option>
                <option value="Python">Python</option>
                <option value="Java">Java</option>
            </select><br><br>

            <label for="notaFinal">Nota Final:</label><br>
            <input type="number" id="notaFinal" name="notaFinal" min="0" max="10" step="0.1"
                placeholder="De 0 a 10" required><br><br>

            <input type="submit" id="btnCadastrar" value="Cadastrar">
            <input type="button" id="btnCancelar" value="Cancelar edição" hidden>
        </form>

        <hr>

        <h3>Alunos Cadastrados</h3>
        <table border="1" cellpadding="3" cellspacing="0">
            <thead>
                <tr>
                    <th bgcolor="grey" width="180">Nome</th>
                    <th bgcolor="grey" width="80">Idade</th>
                    <th bgcolor="grey" width="130">Curso</th>
                    <th bgcolor="grey" width="100">Nota Final</th>
                    <th bgcolor="grey" width="110">Situação</th>
                    <th bgcolor="grey" width="150">Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaAlunos">
            </tbody>
        </table>

        <hr>

        <h3 id="relatorios">Relatórios</h3>
        <input type="button" id="btnAprovados" value="Alunos aprovados">
        <input type="button" id="btnMediaNotas" value="Média das notas">
        <input type="button" id="btnMediaIdades" value="Média das idades">
        <input type="button" id="btnOrdemAlfabetica" value="Ordem alfabética">
        <input type="button" id="btnPorCurso" value="Alunos por curso">

        <div id="resultadoRelatorio" class="mt-3 mb-5"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/aluno.js"></script>
    <script src="./js/alunoController.js"></script>
</body>

</html>
